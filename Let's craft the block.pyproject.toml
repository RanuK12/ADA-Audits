[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "ada-audits"
version = "0.1.0"
description = "Accessibility audit toolkit - WCAG compliance scoring and reporting"
authors = [
    {name = "Emilio Ranucoli", email = "ranucoliemilio@gmail.com"}
]
license = {text = "MIT"}
python_requires = ">=3.10"
dependencies = [
    "requests",
    "beautifulsoup4",
]
[project.optional-dependencies]
selenium = ["selenium"]

[project.scripts]
ada-audit = "scripts.compliance_score:main"
