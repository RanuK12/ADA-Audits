[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ada-audits"
version = "0.2.0"
description = "Automated ADA/WCAG accessibility audit pipeline — scan, score, and generate branded PDF reports"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Emilio Ranucoli", email = "ranucoliemilio@gmail.com" },
]
requires-python = ">=3.10"
dependencies = [
    "jinja2>=3.1",
    "weasyprint>=60",
    "anthropic>=0.30",
    "requests>=2.31",
    "beautifulsoup4>=4.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.3",
]
selenium = ["selenium>=4.15"]

[tool.setuptools.packages.find]
include = ["scripts*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N"]

[tool.ruff.format]
quote-style = "double"

[project.scripts]
ada-scan = "scripts.compliance_score:main"
ada-audit = "scripts.compliance_score:main"
