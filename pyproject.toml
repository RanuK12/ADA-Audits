[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "ada-audits"
version = "0.1.0"
description = "Accessibility audit toolkit — WCAG compliance scoring and reporting"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "Emilio Ranucoli", email = "ranucoliemilio@gmail.com" },
]
dependencies = [
    "requests",
    "beautifulsoup4",
]
optional-dependencies = {
    selenium = ["selenium"],
}

[project.scripts]
ada-audit = "scripts.compliance_score:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["scripts*"]
